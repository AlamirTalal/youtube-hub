<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tube Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-start">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu">
        <span class="material-symbols-rounded">menu</span>
      </button>
      <a class="brand" href="/">
        <span class="brand-mark material-symbols-rounded">play_arrow</span>
        <span class="brand-name" data-i18n="appName">Tube Hub</span>
      </a>
    </div>

    <form id="searchForm" class="search-form">
      <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="ابحث" autocomplete="off" />
      <button type="submit" class="search-btn" aria-label="بحث">
        <span class="material-symbols-rounded">search</span>
      </button>
    </form>

    <div class="topbar-end">
      <button id="langBtn" class="lang-btn" type="button">EN</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Theme">
        <span class="material-symbols-rounded">dark_mode</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="tab active" data-view="home">
        <span class="material-symbols-rounded">home</span>
        <span data-i18n="tabHome">الرئيسية</span>
      </button>
      <button class="tab" data-view="likes">
        <span class="material-symbols-rounded">thumb_up</span>
        <span data-i18n="tabLikes">اللايكات</span>
      </button>
      <button class="tab" data-view="history">
        <span class="material-symbols-rounded">history</span>
        <span data-i18n="tabHistory">السجل</span>
      </button>
      <button class="tab" data-view="follows">
        <span class="material-symbols-rounded">subscriptions</span>
        <span data-i18n="tabFollows">المجالات</span>
      </button>
    </aside>

    <div class="content">
      <div class="chips-bar">
        <nav class="categories" id="categories"></nav>
      </div>

      <main>
        <section id="results" class="grid"></section>
        <div id="status" class="status"></div>
        <div id="sentinel" class="sentinel"></div>
      </main>
    </div>
  </div>

  <!-- صفحة الفيديو -->
  <section id="player" class="player hidden">
    <button id="closePlayer" class="close-btn" type="button" aria-label="Close">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <div class="player-layout">
      <div class="video-wrap">
        <iframe id="videoFrame" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <h2 id="playerTitle"></h2>
      <div class="player-meta">
        <div class="channel-block">
          <span class="material-symbols-rounded avatar">account_circle</span>
          <a id="playerChannel" target="_blank" rel="noopener"></a>
          <button id="followBtn" class="subscribe" type="button"></button>
        </div>
        <div class="player-actions">
          <button id="likeBtn" class="pill-btn" type="button"></button>
        </div>
      </div>
      <p id="playerDesc" class="desc"></p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
